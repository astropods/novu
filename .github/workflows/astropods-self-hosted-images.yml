name: Build self-hosted images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: 3.18.0-node22.23.4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, ws, dashboard]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm ci

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: "image=moby/buildkit:v0.15.0"

      - uses: ./.github/actions/free-space

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build community image
        env:
          SERVICE: ${{ matrix.service }}
          DOCKER_BUILD_ARGUMENTS: --platform=linux/amd64 --provenance=false
        run: |
          cp scripts/dotenvcreate.mjs apps/$SERVICE/src/dotenvcreate.mjs
          cd apps/$SERVICE
          if [ "$SERVICE" = "worker" ]; then
            printf '\nIS_SELF_HOSTED=true\n' >> src/.example.env
          elif [ "$SERVICE" = "dashboard" ]; then
            printf '\nVITE_SELF_HOSTED=true\n' >> .env
          fi
          if [ "$SERVICE" != "dashboard" ]; then
            sed -i 's/pm2-runtime start dist\/main\.js -i max/node dist\/main.js/g' Dockerfile
          fi
          pnpm run docker:build

      - name: Verify Node version and no EE packages
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          version=$(docker run --rm --entrypoint node novu-$SERVICE --version)
          echo "node $version"
          [ "$version" = "v22.23.4" ] || { echo "::error::expected node v22.23.4, got $version"; exit 1; }
          if docker run --rm --entrypoint sh novu-$SERVICE -c 'ls ./node_modules/@novu/ee-*/dist/index.js ./node_modules/@taskforcesh/bullmq-pro 2>/dev/null'; then
            echo "::error::EE files found in $SERVICE"; exit 1
          fi

      - name: Push
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/novu/$SERVICE:$IMAGE_TAG
          docker tag novu-$SERVICE "$image"
          docker push "$image"
